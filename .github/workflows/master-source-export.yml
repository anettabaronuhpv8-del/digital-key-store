name: Export Master Source Snapshot
on:
  push:
    branches: [master-export-20261022]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile and clean-install dependencies
        run: |
          npm install --package-lock-only --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Run complete tests from a clean dependency install
        run: npm test
      - name: Zip exact production source without .git
        run: |
          zip -q -r master-source.zip . -x '.git/*' '*node_modules/*' '.env*' '*.log'
          unzip -t master-source.zip | tail -1
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: digital-key-store-source-export
          path: master-source.zip
          retention-days: 7

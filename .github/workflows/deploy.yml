name: Deploy Digital Key Store
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: digital-key-store-production
  cancel-in-progress: false
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete test suite
        run: npm test
      - name: Validate Worker modules
        run: |
          node --check src/core.js
          node --check src/x402.js
          node --check src/ui.js
          node --check src/worker.js
      - name: Require Cloudflare deployment credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare GitHub Actions credentials are not configured. No deployment attempted."
            exit 1
          fi
      - name: Deploy existing Worker (preserve vars and secrets)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --keep-vars
      - name: Probe Nevermined origin from deployed Worker (read-only, no credentials)
        run: |
          node --input-type=module -e '
            const url="https://digital-key-store.anettabaronuhpv8.workers.dev/api/health/nevermined-origin";
            const r=await fetch(url,{signal:AbortSignal.timeout(15000)});
            if(!r.ok)throw Error("Worker diagnostic route unavailable: HTTP "+r.status);
            const d=await r.json();
            console.log("Nevermined origin diagnostic:",JSON.stringify(d));
          '
      - name: One-shot authenticated Nevermined GET diagnostic (no charge)
        run: |
          node --input-type=module -e '
            const u="https://digital-key-store.anettabaronuhpv8.workers.dev/api/health/nevermined-auth-once";
            const r=await fetch(u,{signal:AbortSignal.timeout(15000)});
            if(!r.ok)throw Error("Diagnostic unavailable HTTP "+r.status);
            const d=await r.json();
            console.log("Sanitized authenticated Nevermined GET:",JSON.stringify(d));
          '
      - name: Verify public health and checkout lock
        run: |
          node --input-type=module -e '
            const u="https://digital-key-store.anettabaronuhpv8.workers.dev/api/health";
            const r=await fetch(u,{headers:{"Cache-Control":"no-cache"}});
            if(!r.ok)throw Error("Worker health endpoint failed: "+r.status);
            const data=await r.json();
            if(data.ok!==true||data.checkoutEnabled!==false)throw Error("Worker health or checkout lock invalid");
            console.log("Production health passed; checkout remains disabled.");
          '

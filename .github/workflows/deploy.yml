name: Deploy Digital Key Store
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: digital-key-store-production
  cancel-in-progress: false
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete test suite
        run: npm test
      - name: Validate Worker modules
        run: |
          node --check src/core.js
          node --check src/x402.js
          node --check src/ui.js
          node --check src/worker.js
      - name: Require Cloudflare deployment credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare GitHub Actions credentials are not configured. No deployment attempted."
            exit 1
          fi
      - name: Deploy existing Worker (preserve vars and secrets)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --keep-vars
      - name: Verify public health and configured checkout state
        run: |
          node --input-type=module -e '
            const u="https://digital-key-store.anettabaronuhpv8.workers.dev/api/health";
            const r=await fetch(u,{headers:{"Cache-Control":"no-cache"}});
            if(!r.ok)throw Error("Worker health endpoint failed: "+r.status);
            const data=await r.json();
            const {readFileSync}=await import("node:fs");
            const expected=/CHECKOUT_ENABLED\s*=\s*"true"/.test(readFileSync("wrangler.toml","utf8"));
            if(data.ok!==true||data.checkoutEnabled!==expected)throw Error("Worker health or checkout activation does not match source configuration");
            console.log("Production health passed; checkout "+(expected?"enabled":"locked")+".");
          '
      - name: Verify four public key purchase offers
        run: |
          node --input-type=module -e '
            const origin="https://digital-key-store.anettabaronuhpv8.workers.dev";
            const r=await fetch(origin+"/api/products",{headers:{"Cache-Control":"no-cache"}});
            if(!r.ok)throw Error("Catalog unavailable: "+r.status);
            const d=await r.json();
            if(d.checkoutEnabled===true){
              const expected={"package-1":100,"package-2":200,"package-3":300,"package-5":500};
              for(const [id,cents] of Object.entries(expected)){
                const p=d.products.find(x=>x.id===id);
                if(!p||p.price_cents!==cents||p.stock<1||p.ready!==true)throw Error("Public Buy button not ready for "+id);
              }
              const home=await fetch(origin);
              if(!home.ok||!(await home.text()).includes("Buy 1 Key"))throw Error("Buyer storefront is not rendering purchase controls");
              console.log("Public checkout offers verified: $1, $2, $3, $5; Buyer x402 checkout enabled.");
            }else console.log("Public checkout locked; catalog checked without enabling payment.");
          '
